[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc651-maintenance-course"
version = "0.1.0"
description = "Student lab starters and support for COSC-651"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.1"]
course = ["mcp==1.28.1", "crewai==1.15.22", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel>=6,<8", "pytest==9.1.1"]

[project.scripts]
maintenance-course = "maintenance_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maintenance_course*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E401", "E701", "E702"]
